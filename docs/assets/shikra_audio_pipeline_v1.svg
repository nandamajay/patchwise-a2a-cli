<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1240" viewBox="0 0 2200 1240">
  <defs>
    <style>
      .title { font: 700 44px 'Segoe UI', Arial, sans-serif; fill:#10223c; }
      .col-title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill:#10223c; }
      .label { font: 600 26px 'Segoe UI', Arial, sans-serif; fill:#172b4d; }
      .small { font: 500 22px 'Segoe UI', Arial, sans-serif; fill:#314a6d; }
      .tiny { font: 500 19px 'Segoe UI', Arial, sans-serif; fill:#425e86; }
      .box { fill:#ffffff; stroke:#3a4c66; stroke-width:3; rx:18; ry:18; }
      .panel { fill:#ffffff; stroke:#e3e9f4; stroke-width:2; rx:20; ry:20; }
      .clockbox { fill:#ffe8e8; stroke:#cd7272; stroke-width:3; stroke-dasharray:10 8; rx:16; ry:16; }
      .lpass { fill:#ffffff; stroke:#9fb2cc; stroke-width:3; rx:16; ry:16; }
      .phy { fill:#efe8f8; stroke:#a389c8; stroke-width:3; rx:16; ry:16; }
      .ext { fill:#e8f4e7; stroke:#8fbd86; stroke-width:3; rx:16; ry:16; }
      .control { stroke:#7a8ea8; stroke-width:3; fill:none; }
      .audio { stroke:#3a6ea8; stroke-width:4; fill:none; }
      .clk { stroke:#c05d5d; stroke-width:3; fill:none; stroke-dasharray:8 8; }
      .gpio { stroke:#8a68b2; stroke-width:3; fill:none; stroke-dasharray:4 6; }
      .rst { stroke:#cf8d1c; stroke-width:3; fill:none; stroke-dasharray:11 7; }
    </style>

    <marker id="arrow-audio" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#3a6ea8"/>
    </marker>
    <marker id="arrow-control" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#7a8ea8"/>
    </marker>
    <marker id="arrow-clk" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#c05d5d"/>
    </marker>
    <marker id="arrow-gpio" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#8a68b2"/>
    </marker>
    <marker id="arrow-rst" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#cf8d1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2200" height="1240" fill="#f7faff"/>
  <text x="44" y="66" class="title">Shikra Audio Pipeline (LPASS + SoundWire + Codec/Amplifier Interfaces)</text>

  <!-- Column panels -->
  <rect x="36" y="110" width="450" height="1060" class="panel"/>
  <rect x="520" y="110" width="670" height="1060" class="panel"/>
  <rect x="1225" y="110" width="420" height="1060" class="panel"/>
  <rect x="1680" y="110" width="485" height="1060" class="panel"/>

  <text x="162" y="155" class="col-title">Host + Control</text>
  <text x="742" y="155" class="col-title">LPASS Audio Subsystem</text>
  <text x="1298" y="155" class="col-title">Board PHY / Nets</text>
  <text x="1832" y="155" class="col-title">External Audio</text>

  <!-- Host/Control blocks -->
  <rect x="72" y="250" width="378" height="118" class="box"/>
  <text x="261" y="298" text-anchor="middle" class="label">Apps Processor</text>
  <text x="261" y="334" text-anchor="middle" class="small">ALSA + ASoC Machine Driver</text>

  <rect x="72" y="430" width="378" height="140" class="box"/>
  <text x="261" y="478" text-anchor="middle" class="label">Clock / Reset Manager</text>
  <text x="261" y="515" text-anchor="middle" class="small">audiocorecc + LPASS CC</text>
  <text x="261" y="548" text-anchor="middle" class="tiny">swr_audio_cgcr, mclk, npl, fsgen</text>

  <rect x="110" y="640" width="302" height="118" class="clockbox"/>
  <text x="261" y="686" text-anchor="middle" class="label">Macro Clocks</text>
  <text x="261" y="720" text-anchor="middle" class="small">RX / VA domains</text>

  <rect x="110" y="810" width="302" height="118" class="clockbox"/>
  <text x="261" y="857" text-anchor="middle" class="label">Core Clocks</text>
  <text x="261" y="891" text-anchor="middle" class="small">LPASS fabric + AHB/AXI</text>

  <!-- LPASS blocks -->
  <rect x="560" y="205" width="590" height="182" class="lpass"/>
  <text x="855" y="250" text-anchor="middle" class="label">Speaker Playback Path</text>
  <rect x="610" y="278" width="490" height="84" class="box"/>
  <text x="855" y="329" text-anchor="middle" class="label">swr1 @a060000 (RX Master) + rxmacro</text>

  <rect x="560" y="420" width="590" height="182" class="lpass"/>
  <text x="855" y="465" text-anchor="middle" class="label">Headphone Playback Path</text>
  <rect x="610" y="493" width="490" height="84" class="box"/>
  <text x="855" y="544" text-anchor="middle" class="label">swr1 @a060000 -> PM4125 RX ports</text>

  <rect x="560" y="635" width="590" height="182" class="lpass"/>
  <text x="855" y="680" text-anchor="middle" class="label">Mic Capture Path</text>
  <rect x="610" y="708" width="490" height="84" class="box"/>
  <text x="855" y="759" text-anchor="middle" class="label">swr0 @a080000 (VA_TX Master) + vamacro</text>

  <rect x="560" y="850" width="590" height="262" class="lpass"/>
  <text x="855" y="895" text-anchor="middle" class="label">Sideband Control + Wake/IRQ</text>
  <rect x="610" y="923" width="490" height="72" class="box"/>
  <text x="855" y="968" text-anchor="middle" class="label">i2c3 -> wsa885x_i2c@c (amp programming)</text>
  <rect x="610" y="1014" width="490" height="72" class="box"/>
  <text x="855" y="1059" text-anchor="middle" class="label">GPIO/IRQ: CODEC_INT, WSA interrupt, PWDN</text>

  <!-- PHY layer blocks -->
  <rect x="1265" y="250" width="340" height="118" class="phy"/>
  <text x="1435" y="298" text-anchor="middle" class="label">SWR_RX_CLK / DATA0/1</text>
  <text x="1435" y="334" text-anchor="middle" class="small">R40770..R40772 links</text>

  <rect x="1265" y="460" width="340" height="118" class="phy"/>
  <text x="1435" y="508" text-anchor="middle" class="label">SWR_TX_CLK / DATA0</text>
  <text x="1435" y="544" text-anchor="middle" class="small">R40773..R40774 links</text>

  <rect x="1265" y="670" width="340" height="118" class="phy"/>
  <text x="1435" y="718" text-anchor="middle" class="label">CODEC_INT + WSA GPIOs</text>
  <text x="1435" y="754" text-anchor="middle" class="small">interrupt-gpios / powerdown-gpios</text>

  <rect x="1265" y="880" width="340" height="118" class="phy"/>
  <text x="1435" y="928" text-anchor="middle" class="label">I2C3 PHY + Control</text>
  <text x="1435" y="964" text-anchor="middle" class="small">amp register interface</text>

  <!-- External blocks -->
  <rect x="1725" y="230" width="395" height="150" class="ext"/>
  <text x="1922" y="286" text-anchor="middle" class="label">WSA885x Amplifier</text>
  <text x="1922" y="322" text-anchor="middle" class="small">Smart Speaker Path</text>

  <rect x="1725" y="430" width="395" height="150" class="ext"/>
  <text x="1922" y="486" text-anchor="middle" class="label">PM4125 Codec RX</text>
  <text x="1922" y="522" text-anchor="middle" class="small">Headphone / Jack Path</text>

  <rect x="1725" y="630" width="395" height="150" class="ext"/>
  <text x="1922" y="686" text-anchor="middle" class="label">PM4125 Codec TX</text>
  <text x="1922" y="722" text-anchor="middle" class="small">Mic ADC / Capture Path</text>

  <rect x="1725" y="830" width="395" height="150" class="ext"/>
  <text x="1922" y="886" text-anchor="middle" class="label">Endpoints</text>
  <text x="1922" y="922" text-anchor="middle" class="small">Headphones + Speaker + Mics</text>

  <!-- Signal lines Host -> LPASS -->
  <path d="M450 308 C510 308 520 320 610 320" class="control" marker-end="url(#arrow-control)"/>
  <path d="M450 478 C520 478 530 520 610 520" class="clk" marker-end="url(#arrow-clk)"/>
  <path d="M450 525 C520 525 530 735 610 735" class="rst" marker-end="url(#arrow-rst)"/>

  <path d="M412 700 C500 700 500 320 610 320" class="clk" marker-end="url(#arrow-clk)"/>
  <path d="M412 700 C500 700 500 520 610 520" class="clk" marker-end="url(#arrow-clk)"/>
  <path d="M412 870 C500 870 500 735 610 735" class="clk" marker-end="url(#arrow-clk)"/>
  <path d="M412 870 C500 870 500 1048 610 1048" class="clk" marker-end="url(#arrow-clk)"/>

  <!-- LPASS -> PHY -->
  <path d="M1100 320 L1265 320" class="audio" marker-end="url(#arrow-audio)"/>
  <path d="M1100 520 L1265 520" class="audio" marker-end="url(#arrow-audio)"/>
  <path d="M1100 735 L1265 735" class="audio" marker-end="url(#arrow-audio)"/>
  <path d="M1100 960 L1265 940" class="control" marker-end="url(#arrow-control)"/>
  <path d="M1100 1048 L1265 735" class="gpio" marker-end="url(#arrow-gpio)"/>

  <!-- PHY -> External -->
  <path d="M1605 320 L1725 305" class="audio" marker-end="url(#arrow-audio)"/>
  <path d="M1605 320 L1725 505" class="audio" marker-end="url(#arrow-audio)"/>
  <path d="M1605 520 L1725 705" class="audio" marker-end="url(#arrow-audio)"/>
  <path d="M1605 735 L1725 885" class="gpio" marker-end="url(#arrow-gpio)"/>
  <path d="M1605 940 L1725 305" class="control" marker-end="url(#arrow-control)"/>

  <!-- Endpoint fanout labels -->
  <text x="1778" y="1028" class="small">Headphones</text>
  <text x="1942" y="1028" class="small">Speaker</text>
  <text x="2063" y="1028" class="small">Mics</text>

  <path d="M1800 985 L1800 1042" class="audio" marker-end="url(#arrow-audio)"/>
  <path d="M1940 985 L1940 1042" class="audio" marker-end="url(#arrow-audio)"/>
  <path d="M2070 985 L2070 1042" class="audio" marker-end="url(#arrow-audio)"/>

  <!-- Legend -->
  <rect x="60" y="1095" width="2080" height="62" class="panel"/>
  <line x1="110" y1="1128" x2="180" y2="1128" class="audio" marker-end="url(#arrow-audio)"/>
  <text x="192" y="1136" class="tiny">Audio stream</text>
  <line x1="390" y1="1128" x2="460" y2="1128" class="clk" marker-end="url(#arrow-clk)"/>
  <text x="472" y="1136" class="tiny">Clock path</text>
  <line x1="640" y1="1128" x2="710" y2="1128" class="rst" marker-end="url(#arrow-rst)"/>
  <text x="722" y="1136" class="tiny">Reset sequencing</text>
  <line x1="945" y1="1128" x2="1015" y2="1128" class="gpio" marker-end="url(#arrow-gpio)"/>
  <text x="1027" y="1136" class="tiny">GPIO / IRQ control</text>
  <line x1="1270" y1="1128" x2="1340" y2="1128" class="control" marker-end="url(#arrow-control)"/>
  <text x="1352" y="1136" class="tiny">I2C / sideband control</text>

  <text x="1655" y="1136" class="tiny">Shikra DTS refs: swr1@a060000, swr0@a080000, rxmacro, vamacro, wsa885x_i2c@c</text>
</svg>
